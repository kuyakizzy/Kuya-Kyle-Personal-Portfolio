<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Protected Page</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    #protectedContent { display: none; }
    #error { color: red; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Enter Password to Access Portfolio</h2>
  <input type="password" id="passwordInput" placeholder="Enter password" />
  <button onclick="checkPassword()">Submit</button>
  <div id="error"></div>

  <div id="protectedContent">
    <h1>Welcome to the Full Page!</h1>
    <p>This Portfolio is under Construction! V1 Rollout: January 1st 2026 </p>
  </div>

  <script>
    const correctPassword = "password"; // Change this to your actual password

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("error");
      const content = document.getElementById("protectedContent");

      if (input === correctPassword) {
        content.style.display = "block";
        error.textContent = "";
      } else {
        error.textContent = "Wrong password. Try again.";
        content.style.display = "none";
      }
    }
  </script>
</body>
</html>
